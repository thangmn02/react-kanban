# A full Supabase project configuration for local development.
# Run `supabase start` to spin up a local stack, then `supabase db reset` to
# apply all tracked migrations to a clean database.

project_id = "react-kanban"

[api]
enabled = true
port = 54321
schemas = ["public", "app_private"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[analytics]
enabled = false

# This repository has no Edge Functions. Keeping the runtime disabled avoids a
# network-only JSR dependency during database reproducibility checks.
[edge_runtime]
enabled = false
