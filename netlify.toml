[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."beat-event-cache"]
  included_files = ["public/beat-tracks/**"]

[[redirects]]
  from = "/api/beat-events"
  to = "/.netlify/functions/beat-event-cache"
  status = 200
  force = true

[[headers]]
  for = "/downloads/latest.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/downloads/Kora-setup.exe"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/octet-stream"

[[redirects]]
  from = "/api/task-breakdown"
  to = "/.netlify/functions/task-breakdown"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
