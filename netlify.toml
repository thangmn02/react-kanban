[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."beat-event-cache"]
  included_files = ["public/beat-tracks/**"]

[functions."note-images"]
  external_node_modules = ["sharp"]

[[redirects]]
  from = "/api/note-images"
  to = "/.netlify/functions/note-images"
  status = 200
  force = true

[[redirects]]
  from = "/api/beat-events"
  to = "/.netlify/functions/beat-event-cache"
  status = 200
  force = true

# Security headers for every page and API response.
# The Content-Security-Policy is report-only for now: violations show in the browser console but nothing is blocked.
# Once the console stays clean on the live site, rename it to Content-Security-Policy to enforce it.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; worker-src 'self' blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com https://docs.google.com https://www.figma.com https://miro.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"

[[headers]]
  for = "/downloads/kora-music-companion.zip"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/zip"

[[headers]]
  for = "/downloads/kanban-music-companion.zip"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/zip"

[[headers]]
  for = "/downloads/latest.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/downloads/Kora-setup.exe"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/octet-stream"

[[redirects]]
  from = "/api/task-breakdown"
  to = "/.netlify/functions/task-breakdown"
  status = 200
  force = true

[[redirects]]
  from = "/api/share-feed"
  to = "/.netlify/functions/share-feed"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
