[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."beat-event-cache"]
  included_files = ["public/beat-tracks/**"]

[functions."note-images"]
  external_node_modules = ["sharp"]

[[redirects]]
  from = "/api/note-images"
  to = "/.netlify/functions/note-images"
  status = 200
  force = true

[[redirects]]
  from = "/api/beat-events"
  to = "/.netlify/functions/beat-event-cache"
  status = 200
  force = true

[[headers]]
  for = "/downloads/kora-music-companion.zip"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/zip"

[[headers]]
  for = "/downloads/kanban-music-companion.zip"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/zip"

[[headers]]
  for = "/downloads/latest.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/downloads/Kora-setup.exe"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/octet-stream"

[[redirects]]
  from = "/api/task-breakdown"
  to = "/.netlify/functions/task-breakdown"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
