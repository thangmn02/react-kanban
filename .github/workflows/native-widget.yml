name: Windows widget

on:
  workflow_dispatch:
    inputs:
      demo:
        description: Build an offline mock-auth demo instead of the connected app
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-widget.yml'
      - 'src-tauri/**'
      - 'src/features/native/**'
      - 'src/features/music/**'
      - 'src/components/focus/**'
      - 'src/hooks/usePomodoroTimer.ts'
      - 'src/App.tsx'
      - 'src/AppLayout.tsx'
      - 'package.json'
      - 'package-lock.json'

# Build downloadable artifacts only. No tags, release publishing, or signing.
permissions:
  contents: read

concurrency:
  group: native-widget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VITE_AUTH_MODE: ${{ inputs.demo && 'mock' || 'supabase' }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install frontend dependencies
        run: npm ci
      - name: Check frontend and native integration
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test -- src/features/native src/features/music src/hooks/usePomodoroTimer.test.tsx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test native audio and tempo analysis
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Validate connected-app configuration
        if: ${{ !inputs.demo }}
        run: |
          if (!$env:VITE_SUPABASE_URL -or !$env:VITE_SUPABASE_ANON_KEY) {
            throw 'Set repository Actions variables VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY, or manually run this workflow with demo enabled. Never use a service-role or Gemini key.'
          }
      - name: Build unsigned Windows installer
        run: npm run tauri build -- --ci
      - name: Upload installer and portable executable
        uses: actions/upload-artifact@v4
        with:
          name: Kanban-Focus-Windows-${{ inputs.demo && 'demo' || 'connected' }}-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/kanban-widget.exe
          if-no-files-found: error
          retention-days: 14
