name: Windows widget

on:
  workflow_dispatch:
    inputs:
      demo:
        description: Build an offline mock-auth demo instead of the connected app
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-widget.yml'
      - 'src-tauri/**'
      - 'src/**'
      - 'public/**'
      - 'extensions/kanban-music/**'
      - 'scripts/**'
      - 'server/**'
      - 'index.html'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'package.json'
      - 'package-lock.json'

# Pushes run the checks and tests. Signed update artifacts are built only when the workflow is started by hand,
# and lack the Companion (see below); releases come from scripts/build-release.mjs. No automatic release or deploy.
permissions:
  contents: read

concurrency:
  group: native-widget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VITE_AUTH_MODE: ${{ inputs.demo && 'mock' || 'supabase' }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_ENABLE_NOTES_PREVIEW: ${{ vars.VITE_ENABLE_NOTES_PREVIEW }}
      VITE_NOTE_IMAGES_URL: ${{ vars.VITE_NOTE_IMAGES_URL }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install frontend dependencies
        run: npm ci
      - name: Check frontend and native integration
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The Music Companion bundle is built from private model assets by scripts/build-release.mjs on the release
      # machine and is never committed, so the app's resource folder is missing here. Tests only need the folder.
      - name: Stand in for the Music Companion bundle
        run: |
          if (!(Test-Path src-tauri/generated/music-companion)) {
            New-Item -ItemType Directory -Force src-tauri/generated/music-companion | Out-Null
            Set-Content src-tauri/generated/music-companion/PLACEHOLDER.txt 'CI placeholder; releases bundle the real Companion.'
          }
      - name: Test native bridge and analysis regressions
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Validate connected-app configuration
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.demo }}
        run: |
          if (!$env:VITE_SUPABASE_URL -or !$env:VITE_SUPABASE_ANON_KEY) {
            throw 'Set repository Actions variables VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY, or manually run this workflow with demo enabled. Never use a service-role or Gemini key.'
          }
      - name: Validate updater signing configuration
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if (!$env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'Configure the protected TAURI_SIGNING_PRIVATE_KEY Actions secret. Never commit the private signing key.'
          }
      - name: Build Windows installer with updater signature
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: npm run tauri build -- --ci
      - name: Prepare web download
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: npm run desktop:package
      - name: Upload installer and portable executable
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: Kora-Windows-${{ inputs.demo && 'demo' || 'connected' }}-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/kora.exe
            public/downloads/Kora-setup.exe
            public/downloads/latest.json
          if-no-files-found: error
          retention-days: 14
