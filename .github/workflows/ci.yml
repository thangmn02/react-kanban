name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 19 * * *'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Dependency-aware lane selection
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.plan.outputs.browser }}
      analysis: ${{ steps.plan.outputs.analysis }}
      native: ${{ steps.plan.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify selector invariants
        run: npm run test:impact
      - name: Select lanes with conservative fallback
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node scripts/test-impact.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --json src-tauri/target/test-impact/selection.json --github-output
          else
            node scripts/test-impact.mjs --full --json src-tauri/target/test-impact/selection.json --github-output
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: test-selection
          path: src-tauri/target/test-impact/selection.json
          retention-days: 7

  quality:
    name: Lint, Type-check, Test, Build, Bundle budget
    runs-on: ubuntu-latest
    needs: select

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: test-selection
          path: src-tauri/target/test-impact

      - name: Lint
        run: npm run lint

      # Uses `tsc -b` (project references) — the previous `npx tsc --noEmit`
      # no-op'd because the root tsconfig only references projects (§11).
      - name: Type-check
        run: npm run typecheck

      - name: Unit tests (coverage)
        run: node scripts/run-affected-tests.mjs --plan src-tauri/target/test-impact/selection.json --lane unit

      - name: Build
        run: npm run build

      - name: Bundle-size budget
        run: npm run bundle-size

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: coverage/
          retention-days: 7

  database:
    name: Supabase reset, lint, and RLS isolation
    runs-on: ubuntu-latest

    # Requires Docker (the Supabase CLI runs the local stack in containers).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start local Supabase stack
        run: supabase start

      - name: Reset database from clean state
        run: supabase db reset

      - name: Lint database
        run: supabase db lint --level warning --fail-on error

      - name: Test workspace RLS isolation
        run: supabase test db supabase/tests/database --local

  e2e:
    name: Playwright E2E (local mock mode)
    runs-on: ubuntu-latest
    needs: select
    if: needs.select.outputs.browser == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: test-selection
          path: src-tauri/target/test-impact

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: node scripts/run-affected-tests.mjs --plan src-tauri/target/test-impact/selection.json --lane browser

  analysis:
    name: Server analysis contracts (no model inference)
    needs: select
    if: needs.select.outputs.analysis == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy==1.26.4
      - run: python -m unittest discover -s server/audio-analysis -p 'test_*.py'

  native:
    name: Windows shared-contract regression
    needs: select
    if: needs.select.outputs.native == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run music:package
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
